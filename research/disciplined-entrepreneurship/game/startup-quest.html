.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(140%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 800; transition: transform .35s, opacity .35s, visibility .35s; z-index: 10; opacity: 0; visibility: hidden; max-width: calc(100% - 32px); text-align: center; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  ["«Все захотят купить»", "warn", "Проверь", "Слова — не покупки. Проверяется предзаказами: попроси 10 человек забронировать аромат."]
];

/* ------------------------------------------------------------------ состояние */
const KEY = "startup-quest-v1";
function fresh() { return { v: 1, xp: 0, a: {}, got: {}, quiz: {}, done: {}, sales: [] }; }
let S = fresh();
try { const raw = JSON.parse(localStorage.getItem(KEY)); if (raw && raw.v === 1) S = Object.assign(fresh(), raw); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => isFinite(n) ? Math.round(n).toLocaleString("ru-RU") : "—";
const num = (k, d) => { const v = parseFloat(String(S.a[k] ?? "").replace(",", ".")); return isFinite(v) ? v : d; };
const val = k => S.a[k] ?? "";

function level() {
  let i = 0; LEVELS.forEach((l, j) => { if (S.xp >= l[0]) i = j; });
  const cur = LEVELS[i], nxt = LEVELS[i + 1];
  return { i, name: cur[1], from: cur[0], to: nxt ? nxt[0] : null };
}
let toastT;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600);
}
function addXP(n, key) {
  if (key) { if (S.got[key]) return; S.got[key] = 1; }
  const before = level().i;
  S.xp += n; save();
  const after = level();
  toast(after.i > before ? "Новый уровень: " + after.name + "!" : "+" + n + " XP");
  const x = document.getElementById("xpline"); if (x) x.outerHTML = xpCard(true);
}
const unlocked = i => i === 0 || !!S.done[M[i - 1].id];

/* ------------------------------------------------------------------ главная */
function xpCard(inner) {
  const L = level();
  const pct = L.to ? Math.min(100, (S.xp - L.from) / (L.to - L.from) * 100) : 100;
  return `<div class="xpcard" id="xpline">
    <div class="lvl-badge" aria-hidden="true">${L.i + 1}</div>
    <div><div class="label muted">Уровень ${L.i + 1}</div><b>${esc(L.name)}</b></div>
    <div class="xpnum">${fmt(S.xp)} XP</div>
    <div class="xpbar" aria-label="Прогресс до следующего уровня"><i style="width:${pct}%"></i></div>
  </div>`;
}

function mapSVG() {
  const W = 340, step = 104, top = 56, H = top * 2 + step * 7;
  const pts = M.map((m, i) => [i % 2 ? 258 : 82, top + i * step]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    d += ` C${x0},${y0 + step * .6} ${x1},${y1 - step * .6} ${x1},${y1}`;
  }
  const nodes = M.map((m, i) => {
    const [x, y] = pts[i], open = unlocked(i), done = !!S.done[m.id];
    const fill = open ? `var(${m.color})` : "var(--locked)";
    const lx = i % 2 ? x - 50 : x + 50, anchor = i % 2 ? "end" : "start";
    return `<g class="node ${open ? "" : "locked"}" data-go="${m.id}" tabindex="${open ? 0 : -1}" role="button" aria-label="Миссия ${i + 1}: ${esc(m.title)}${open ? "" : " (закрыта)"}">
      <circle class="ring" cx="${x}" cy="${y}" r="36" fill="var(--surface)" stroke="${fill}" stroke-width="5"/>
      <circle cx="${x}" cy="${y}" r="28" fill="${fill}"/>
      ${done ? `<path d="M${x - 11},${y} l7,8 l15,-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`
             : open ? `<text x="${x}" y="${y + 8}" text-anchor="middle" font-family="Unbounded, sans-serif" font-weight="800" font-size="22" fill="${m.dark ? "#1b2333" : "#fff"}">${i + 1}</text>`
             : `<path d="M${x - 8},${y - 2} v-5 a8,8 0 0 1 16,0 v5 M${x - 11},${y - 2} h22 v14 h-22 Z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>`}
      <text x="${lx}" y="${y - 4}" text-anchor="${anchor}" font-family="Manrope, sans-serif" font-weight="800" font-size="15" fill="var(--ink)">${esc(m.short)}</text>
      <text x="${lx}" y="${y + 15}" text-anchor="${anchor}" font-family="Manrope, sans-serif" font-weight="600" font-size="12" fill="var(--ink-soft)">шаги MIT ${m.steps}</text>
    </g>`;
  }).join("");
  const finish = `<g><rect x="104" y="${H - 34}" width="132" height="30" rx="15" fill="${S.done.m8 ? "var(--ink)" : "var(--locked)"}"/>
    <text x="170" y="${H - 14}" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="13" fill="var(--bg)">ДЕМО-ДЕНЬ</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H + 6}" role="group" aria-label="Карта миссий">
    <path d="${d}" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/>
    <path d="${d}" fill="none" stroke="var(--surface)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <path d="M${pts[7][0]},${pts[7][1]} C${pts[7][0]},${pts[7][1] + 40} 170,${H - 70} 170,${H - 34}" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/>
    ${nodes}${finish}</svg>`;
}

function renderHome() {
  const doneCount = M.filter(m => S.done[m.id]).length;
  const nextI = M.findIndex(m => !S.done[m.id]);
  app.innerHTML = `
  <header class="hero">

    </div>
    <details class="panel"><summary>Как играть</summary>
      <ul>
        <li>Миссии открываются по очереди. Внутри: объяснение, словарик, тест и задание в реальной жизни.</li>
        <li>XP дают за правильные ответы с первой попытки (+10), за каждое заполненное поле (+5) и за пройденную миссию (+50).</li>
        <li>Возвращаться в прошлые миссии можно и нужно: путь последовательный, но не линейный.</li>
        <li>Ответы сохраняются на этом устройстве. Отчёт для родителей можно скопировать и отправить в мессенджер.</li>

    </details>

        <li>Раз в неделю — «совет директоров» на 15 минут: что сделано, что узнал, какие цифры.</li>
        <li>После миссии 8 — «демо-день»: ребёнок показывает отчёт и рассказывает, что поменял по ходу.</li>
        <li>Обратите внимание на миссию 7: там ребёнок сам находит риски реплик с логотипами и выбирает законный вариант бизнеса.</li>
      </ul>
    </details>
    <div class="row"><button class="btn ghost" data-act="reset">Начать игру заново</button><span class="muted" id="resetnote"></span></div>
  </div>`;
}

/* ------------------------------------------------------------------ миссия */

  const idx = M.findIndex(m => m.id === id), m = M[idx];

function quizHTML(qid, q) {
  const st = S.quiz[qid] || { picked: [], solved: false };
  return `<div class="q" data-q="${qid}"><p class="qt">${esc(q.q)}</p><div class="opts">
    ${q.o.map((o, i) => {
      const cls = st.picked.includes(i) ? (i === q.c ? "right" : "wrong") : "";
      return `<button class="opt ${cls}" data-qopt="${qid}|${i}" ${st.solved ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>
    ${st.picked.length ? `<p class="explain">${st.solved ? "Верно! " : "Не совсем. Попробуй ещё. "}${esc(q.e)}</p>` : ""}</div>`;
}

function inp(key, ph, multi) {
  return multi
    ? `<textarea id="f-${key}" data-k="${key}" placeholder="${esc(ph)}">${esc(val(key))}</textarea>`
    : `<input type="text" id="f-${key}" data-k="${key}" placeholder="${esc(ph)}" value="${esc(val(key))}">`;
}
function numInp(key, label, def) {
  return `<label class="f">${esc(label)}<input type="number" inputmode="decimal" id="f-${key}" data-k="${key}" data-num="1" value="${esc(S.a[key] ?? def)}"></label>`;
}

function taskHTML(m, t) {
  const p = m.id + ".";
  const head = `<h3>${esc(t.title)}</h3>${t.hint ? `<p class="hint">${esc(t.hint)}</p>` : ""}`;
  switch (t.type) {
    case "text": return head + inp(p + t.key, t.ph, true);
    case "list": return head + `<div class="grid2">${Array.from({ length: t.n }, (_, i) => `<label class="f">${i + 1}${inp(p + t.key + "." + i, t.ph[i])}</label>`).join("")}</div>`;
    case "fields": return head + `<div class="grid2">${t.fields.map((f, i) => `<label class="f">${esc(f[0])}${inp(p + t.key + "." + i, f[1])}</label>`).join("")}</div>`;
    case "grid": return head + Array.from({ length: t.rows }, (_, r) => `<div class="grid2">${t.cols.map((c, ci) => `<label class="f">${r + 1}. ${esc(c[0])}${inp(p + t.key + "." + r + "." + ci, r === 0 ? c[1] : "")}</label>`).join("")}</div>`).join("");
    case "checks": return head + `<div class="checks">${t.items.map((it, i) => { const k = p + t.key + "." + i;
      return `<label><input type="checkbox" id="f-${k}" data-k="${k}" ${S.a[k] ? "checked" : ""}>${esc(it)}</label>`; }).join("")}</div>`;
    case "pick": return head + pickHTML(p + t.key, t);
    case "segscore": return head + segHTML();
    case "tam": return head + `<p class="hint">Цифры для примера — замени своими.</p><div class="grid2">
      ${numInp("tam.people", "Сколько людей на плацдарме", 60)}${numInp("tam.freq", "Сколько флаконов в год покупает один", 2)}${numInp("tam.check", "Средняя цена одного флакона, ₽", 400)}</div>
      <div class="out" data-out="tam"></div>`;
    case "ten": return head + `<div class="tablewrap"><table><thead><tr><th>#</th><th>Имя / класс</th><th>Реакция</th></tr></thead><tbody>
      ${Array.from({ length: 10 }, (_, i) => `<tr><td>${i + 1}</td><td>${inp("ten." + i + ".n", i === 0 ? "Аня, 8А" : "")}</td><td><select id="f-ten.${i}.r" data-k="ten.${i}.r">
        ${["", "Куплю!", "Может быть", "Не интересно"].map(o => `<option ${val("ten." + i + ".r") === o ? "selected" : ""}>${o}</option>`).join("")}</select></td></tr>`).join("")}
      </tbody></table></div><div class="out" data-out="ten"></div>`;
    case "value": return head + `<p class="hint">Цифры для примера — замени своими.</p><div class="grid2">
      <label class="f">Аромат, на который похож твой${inp("val.brand", "известный дорогой аромат")}</label>
      ${numInp("val.op", "Цена оригинала, ₽", 12000)}${numInp("val.oml", "Объём оригинала, мл", 100)}${numInp("val.mp", "Твоя цена, ₽", 450)}${numInp("val.mml", "Твой объём, мл", 5)}</div>
      <div class="out" data-out="value"></div>`;
    case "compete": return head + competeHTML();
    case "unit": return head + `<p class="hint">Цифры для примера — замени своими.</p><div class="grid2">
      ${numInp("u.bp", "Цена большого флакона у поставщика, ₽", 6000)}${numInp("u.bml", "Объём большого флакона, мл", 100)}
      ${numInp("u.pack", "Пустой мини-флакон + наклейка, ₽", 35)}${numInp("u.mml", "Объём твоего мини-флакона, мл", 5)}
      ${numInp("u.price", "Твоя цена, ₽", 450)}${numInp("u.rep", "Сколько раз клиент купит за год", 3)}
      ${numInp("u.acq", "Траты на привлечение в месяц (пробники, скидки), ₽", 400)}${numInp("u.newc", "Новых клиентов в месяц", 4)}</div>
      <div class="out" data-out="unit"></div>`;
    case "risks": return head + `<div class="cards">${RISKS.map((r, i) => { const open = !!S.a["risk." + i];
      return `<button class="flip ${open ? "open" : ""}" data-risk="${i}" aria-expanded="${open}"><b>${esc(r[0])}</b>
        ${open ? `<span class="tag" style="color:var(--${r[1]})">${esc(r[2])}</span><span>${esc(r[3])}</span>` : `<span class="muted">Нажми, чтобы проверить</span>`}</button>`; }).join("")}</div>`;
    case "sales": return head + salesHTML();
  }
  return "";
}

function pickHTML(k, t) {
  const sel = S.a[k] || [];
  return `<div class="cards">${t.options.map((o, i) => {
    const on = sel.includes(i), bad = t.pivot && o[2];
    return `<button class="card ${on ? "on" : ""} ${on && bad ? "badpick" : ""}" data-pick="${k}|${i}|${t.max}" aria-pressed="${on}"><b>${esc(o[0])}</b><span class="muted">${esc(o[1])}</span>
      ${on && t.pivot ? `<span class="verdict ${bad ? "bad" : "good"}">${esc(o[3])}</span>` : ""}</button>`;
  }).join("")}</div>`;
}

      <td data-out="segsum${i}">0</td><td><input type="radio" name="beach" id="f-beach${i}" data-beach="${i}" ${String(S.a.beach) === String(i) ? "checked" : ""} aria-label="Выбрать плацдарм: ${esc(n)}"></td></tr>`).join("")}

const COMP = ["Ты", "Маркетплейс", "Магазин парфюмерии", "Ничего не покупать"];
const COMPDEF = [[7, 9], [9, 1], [2, 6], [10, 0]];
function competeHTML() {

function unitCost() { return num("u.bp", 6000) / Math.max(1, num("u.bml", 100)) * num("u.mml", 5) + num("u.pack", 35); }

function salesHTML() {
  const rows = S.sales.map((s, i) => `<tr><td>${esc(s.d)}</td><td>${esc(s.c)}</td><td>${esc(s.p)}</td><td style="font-variant-numeric:tabular-nums">${fmt(s.r)} ₽</td>
    <td><button class="btn ghost" style="padding:4px 10px" data-delsale="${i}" aria-label="Удалить продажу">×</button></td></tr>`).join("");
  return `<div class="grid2">
    <label class="f">Клиент (имя)<input type="text" id="sale-c" placeholder="Маша 8Б"></label>
    <label class="f">Аромат<input type="text" id="sale-p" placeholder="Ванильный"></label>
    <label class="f">Цена, ₽<input type="number" inputmode="decimal" id="sale-r" placeholder="450"></label></div>
    <div class="row"><button class="btn" data-act="addsale">Записать продажу</button><span class="muted" id="salemsg"></span></div>
    ${S.sales.length ? `<div class="tablewrap"><table><thead><tr><th>Дата</th><th>Клиент</th><th>Аромат</th><th>Цена</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="hint">Пока продаж нет. Запиши первую — и увидишь статистику.</p>`}
    <div class="out" data-out="sales"></div>`;
}
function salesStats() {
  const by = {};
  S.sales.forEach(s => { const k = s.c.trim().toLowerCase(); by[k] = (by[k] || 0) + 1; });
  const clients = Object.keys(by).length, repeat = Object.values(by).filter(n => n > 1).length;
  const rev = S.sales.reduce((a, s) => a + s.r, 0), cost = unitCost() * S.sales.length;
  return { n: S.sales.length, clients, repeat, rate: clients ? repeat / clients : 0, rev, profit: rev - cost };
}

function doneBar(m, idx) {
  const solved = m.quiz.every((q, qi) => (S.quiz[m.id + ".q" + qi] || {}).solved);
  let ok = solved, why = solved ? "" : "Ответь верно на все вопросы теста, чтобы пройти миссию.";
  if (m.id === "m7") {
    const pv = S.a["m7.pivot"] || [];
    if (!pv.length || pv.includes(3)) { ok = false; why = (why ? why + " " : "") + "Выбери безопасный вариант бизнеса."; }
  }
  if (S.done[m.id]) return `<p class="muted">Миссия пройдена. Значок «${esc(m.badge)}» получен. Можно вернуться и улучшить ответы.</p>
    <button class="btn" data-go="${idx < 7 ? M[idx + 1].id : "report"}">${idx < 7 ? "Дальше: миссия " + (idx + 2) : "К отчёту для демо-дня"}</button>`;
  return `<button class="btn" data-act="finish" data-m="${m.id}" ${ok ? "" : "disabled"}>Завершить миссию · +50 XP</button>${why ? `<p class="muted">${why}</p>` : ""}`;
}

/* ------------------------------------------------------------------ расчёты */
function setOut(name, html) { document.querySelectorAll(`[data-out="${name}"]`).forEach(el => { el.innerHTML = html; }); }
function pill(ratio) {
  if (ratio >= 3) return `<span class="pill good">Отлично</span>`;
  if (ratio >= 1) return `<span class="pill warn">Тонко</span>`;
  return `<span class="pill bad">В минус</span>`;
}
function updateOutputs() {
  if (document.querySelector('[data-out="tam"]')) {
    const t = num("tam.people", 60) * num("tam.freq", 2) * num("tam.check", 400);
    setOut("tam", `<span class="label muted">Твой пирог в год</span><span class="big">${fmt(t)} ₽</span>
      <span>${t < 15000 ? "Пирог небольшой — для первого опыта это нормально. Главное — научиться, а расти будешь на следующих рынках." : "Неплохой пирог! Даже 20–30% от него — хорошие деньги для старта."}</span>`);
  }
  if (document.querySelector('[data-out="ten"]')) {
    let yes = 0, maybe = 0;
    for (let i = 0; i < 10; i++) { const r = val("ten." + i + ".r"); if (r === "Куплю!") yes++; if (r === "Может быть") maybe++; }
    setOut("ten", `<span class="big">${yes} из 10</span><span>${yes >= 5 ? "Отлично: половина готова купить. Можно идти дальше." : yes >= 3 ? "Неплохо, но мало. Поговори ещё или подумай, что изменить." : "Пока мало «куплю». Это сигнал вернуться к выбору плацдарма или товара."}${maybe ? " Ещё «может быть»: " + maybe + "." : ""}</span>`);
  }
  if (document.querySelector('[data-out="value"]')) {
    const op = num("val.op", 12000), oml = num("val.oml", 100), mp = num("val.mp", 450), mml = num("val.mml", 5);
    const opm = op / Math.max(1, oml), mpm = mp / Math.max(1, mml), save = 100 - mp / Math.max(1, op) * 100;
    const brand = (val("val.brand") || "дорогой аромат").trim();
    setOut("value", `<div class="kpis"><div class="kpi"><small>Оригинал за 1 мл</small><span>${fmt(opm)} ₽</span></div><div class="kpi"><small>У тебя за 1 мл</small><span>${fmt(mpm)} ₽</span></div><div class="kpi"><small>Цена ниже на</small><span>${fmt(save)}%</span></div></div>
      <span><b>Твоя фраза для рекламы:</b> «Аромат как ${esc(brand)} — попробуй за ${fmt(mp)} ₽ вместо ${fmt(op)} ₽»</span>`);
  }
  if (document.querySelector('[data-out="seg"]')) {
    const names = segNames(); let best = -1, bestSum = -1;
    names.forEach((n, i) => { let s = 0; for (let c = 0; c < 4; c++) s += num("seg." + i + "." + c, 0); setOut("segsum" + i, String(s)); if (s > bestSum) { bestSum = s; best = i; } });
    const chosen = S.a.beach != null ? names[S.a.beach] : null;
    setOut("seg", bestSum > 0 ? `<span>Больше всего баллов у группы <b>${esc(names[best])}</b> (${bestSum}).</span>${chosen ? `<span>Твой плацдарм: <b>${esc(chosen)}</b></span>` : `<span class="muted">Отметь свой плацдарм в последней колонке.</span>`}` : `<span class="muted">Поставь оценки — и увидишь лучшую группу.</span>`);
  }
  if (document.querySelector('[data-out="plot"]')) {
    const ax = val("cmp.ax") || "Доступная цена", ay = val("cmp.ay") || "Можно понюхать до покупки";
    const cols = ["var(--c2)", "var(--c1)", "var(--c6)", "var(--ink-soft)"];
    let dots = "";
    COMP.forEach((n, i) => {
      const x = num("cmp." + i + ".x", COMPDEF[i][0]), y = num("cmp." + i + ".y", COMPDEF[i][1]);
      setOut("cx" + i, String(x)); setOut("cy" + i, String(y));
      const px = 40 + x * 30, py = 320 - y * 28;
      dots += `<circle cx="${px}" cy="${py}" r="${i ? 8 : 11}" fill="${cols[i]}" stroke="var(--surface)" stroke-width="2"/><text x="${px + (x > 7 ? -14 : 14)}" y="${py + 4}" text-anchor="${x > 7 ? "end" : "start"}" font-size="12" font-weight="${i ? 600 : 800}" fill="var(--ink)">${esc(n)}</text>`;
    });
    setOut("plot", `<svg viewBox="0 0 360 360" role="img" aria-label="Карта конкурентов">
      <rect x="40" y="40" width="300" height="280" fill="var(--surface-2)" stroke="var(--line)"/>
      <rect x="190" y="40" width="150" height="140" fill="var(--mc)" opacity=".12"/>
      <text x="334" y="58" text-anchor="end" font-size="11" font-weight="800" fill="var(--ink-soft)">ЛУЧШЕЕ МЕСТО</text>
      <text x="190" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink-soft)">${esc(ax)} →</text>
      <text x="16" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink-soft)" transform="rotate(-90 16 180)">${esc(ay)} →</text>
      ${dots}</svg>`);
  }
  if (document.querySelector('[data-out="unit"]')) {
    const cost = unitCost(), price = num("u.price", 450), margin = price - cost;
    const ltv = margin * num("u.rep", 3), coca = num("u.acq", 400) / Math.max(1, num("u.newc", 4)), ratio = coca > 0 ? ltv / coca : (ltv > 0 ? 99 : 0);
    const tip = margin <= 0 ? "Ты продаёшь дешевле, чем тебе это стоит! Подними цену или найди поставщика дешевле."
      : ratio >= 3 ? "Каждый клиент приносит больше чем втрое против затрат на его привлечение. Так и держать."
      : ratio >= 1 ? "Ты в плюсе, но запас маленький. Попробуй поднять цену, раздавать пробники меньше или продавать наборы."
      : "Привлечь клиента стоит дороже, чем он приносит. Меняй цену, модель или трать меньше на пробники.";
    setOut("unit", `<div class="kpis"><div class="kpi"><small>Себестоимость флакона</small><span>${fmt(cost)} ₽</span></div>
      <div class="kpi"><small>Маржа с продажи</small><span>${fmt(margin)} ₽</span></div>
      <div class="kpi"><small>LTV — ценность клиента</small><span>${fmt(ltv)} ₽</span></div>
      <div class="kpi"><small>COCA — цена клиента</small><span>${fmt(coca)} ₽</span></div></div>
      <div class="row"><span>LTV ÷ COCA = <b style="font-variant-numeric:tabular-nums">${ratio >= 99 ? "∞" : ratio.toFixed(1).replace(".", ",")}</b></span>${pill(ratio)}</div><span>${tip}</span>`);
  }
  if (document.querySelector('[data-out="sales"]')) {
    const s = salesStats();
    setOut("sales", s.n ? `<div class="kpis"><div class="kpi"><small>Продаж</small><span>${s.n}</span></div><div class="kpi"><small>Выручка</small><span>${fmt(s.rev)} ₽</span></div>
      <div class="kpi"><small>Прибыль (по калькулятору)</small><span>${fmt(s.profit)} ₽</span></div><div class="kpi"><small>Купили повторно</small><span>${fmt(s.rate * 100)}%</span></div></div>
      <span>${s.rate >= .3 ? "<b>Собаки едят корм!</b> Клиенты возвращаются сами — продукт работает." : s.n >= 5 ? "Повторных пока мало. Спроси клиентов, что улучшить, и напомни о себе, когда духи закончатся." : "Собери хотя бы 5–10 продаж, чтобы увидеть картину."}</span>` : "");
  }
}

/* ------------------------------------------------------------------ отчёт */
function reportText() {
  const L = level(), names = segNames(), s = salesStats();
  const line = (t, v) => v ? `${t}: ${v}\n` : "";
  const pickNames = (k, mi, ti) => (S.a[k] || []).map(i => M[mi].tasks[ti].options[i][0]).join(", ");
  const cost = unitCost(), margin = num("u.price", 450) - cost, ltv = margin * num("u.rep", 3), coca = num("u.acq", 400) / Math.max(1, num("u.newc", 4));
  let t = `СТАРТАП-КВЕСТ · ОТЧЁТ ДЛЯ ДЕМО-ДНЯ\n`;
  t += `Уровень: ${L.name} · ${fmt(S.xp)} XP · миссий пройдено: ${M.filter(m => S.done[m.id]).length} из 8\n`;
  t += `Значки: ${M.filter(m => S.done[m.id]).map(m => m.badge).join(", ") || "пока нет"}\n\n`;
  t += `1. КЛИЕНТ\n` + line("Плацдарм", S.a.beach != null ? names[S.a.beach] : "") + line("Персона", [0, 1, 2].map(i => val("m2.persona." + i)).filter(Boolean).join(", "));
  t += line("Объём рынка (TAM)", fmt(num("tam.people", 60) * num("tam.freq", 2) * num("tam.check", 400)) + " ₽ в год");
  let yes = 0; for (let i = 0; i < 10; i++) if (val("ten." + i + ".r") === "Куплю!") yes++;
  t += `Сказали «куплю»: ${yes} из 10\n\n`;
  t += `2. ЦЕННОСТЬ\n` + line("Продукт", val("m3.spec")) + line("Суперсила", pickNames("m4.core", 3, 0)) + line("Ядро одной фразой", val("m4.coreline")) + "\n";
  t += `3. ПРОДАЖИ\n` + line("Право вето", val("m5.dmu.3")) + line("Каналы", pickNames("m5.chan", 4, 3)) + "\n";
  t += `4. ДЕНЬГИ\n` + line("Модель", pickNames("m6.model", 5, 0));
  t += `Себестоимость ${fmt(cost)} ₽ · цена ${fmt(num("u.price", 450))} ₽ · маржа ${fmt(margin)} ₽\nLTV ${fmt(ltv)} ₽ · COCA ${fmt(coca)} ₽ · LTV/COCA = ${coca > 0 ? (ltv / coca).toFixed(1).replace(".", ",") : "—"}\n\n`;
  t += `5. ПРОВЕРКА\n` + line("Выбранный вариант бизнеса", pickNames("m7.pivot", 6, 1) + ((S.a["m7.pivot"] || []).includes(3) ? " (опасный вариант — нужно пересмотреть)" : "")) + line("Минимальный продукт", val("m7.mvbp"));
  for (let r = 0; r < 3; r++) { const a = val("m7.exp." + r + ".0"); if (a) t += `Эксперимент: ${a} → ${val("m7.exp." + r + ".1")} → успех, если ${val("m7.exp." + r + ".2")}\n`; }
  t += `\n6. РЕЗУЛЬТАТЫ\nПродаж: ${s.n} · выручка ${fmt(s.rev)} ₽ · прибыль ≈ ${fmt(s.profit)} ₽ · повторных ${fmt(s.rate * 100)}%\n`;
  t += line("Следующие рынки", [0, 1, 2].map(i => val("m8.nextm." + i)).filter(Boolean).join(", "));
  t += line("План", [0, 1, 2].map(i => val("m8.plan." + i)).filter(Boolean).join(" → "));
  return t;
}
function renderReport() {
  app.style.removeProperty("--mc");
  app.innerHTML = `<div class="topbar"><button class="btn ghost" data-go="home">← Карта</button></div>
  <div class="stack"><header class="hero"><div class="label muted">Финал</div><h1>Демо-день</h1>
    <p class="muted">Покажи этот отчёт своему инвестору — родителям. Расскажи, что ты узнал и что поменял по ходу. Отчёт собирается из твоих ответов во всех миссиях.</p></header>
    <div class="row"><button class="btn" data-act="copy">Скопировать отчёт</button><span class="muted" id="copymsg"></span></div>
    <pre class="report" id="reporttext">${esc(reportText())}</pre></div>`;
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------------ события */
function route() {
  const h = location.hash.replace("#", "");
  if (h === "report") return renderReport();
  if (M.some(m => m.id === h)) return renderMission(h);
  app.style.removeProperty("--mc");
  renderHome();
}
window.addEventListener("hashchange", route);

function go(target) { location.hash = target === "home" ? "" : target; if (target === "home") route(); }

app.addEventListener("click", e => {
  const el = e.target.closest("[data-go],[data-qopt],[data-pick],[data-risk],[data-act],[data-delsale],[data-beach]");
  if (!el) return;
  if (el.dataset.go) {
    const i = M.findIndex(m => m.id === el.dataset.go);
    if (i >= 0 && !unlocked(i)) { toast("Сначала пройди миссию " + i); return; }
    return go(el.dataset.go);
  }
  if (el.dataset.qopt) {
    const [qid, oi] = el.dataset.qopt.split("|"), i = +oi;
    const [mid, qk] = qid.split(".q"), m = M.find(x => x.id === mid), q = m.quiz[+qk];
    const st = S.quiz[qid] || { picked: [], solved: false };
    if (st.solved || st.picked.includes(i)) return;
    const first = st.picked.length === 0;
    st.picked.push(i); if (i === q.c) st.solved = true;
    S.quiz[qid] = st; save();
    if (st.solved && first) addXP(10, "quiz." + qid);
    el.closest(".q").outerHTML = quizHTML(qid, q);
    refreshDone(m);
    return;
  }
  if (el.dataset.pick) {
    const [k, oi, max] = el.dataset.pick.split("|"), i = +oi;
    let sel = (S.a[k] || []).slice();
    if (sel.includes(i)) sel = sel.filter(x => x !== i);
    else { sel.push(i); if (sel.length > +max) sel.shift(); }
    S.a[k] = sel; save();
    const m = M.find(x => k.startsWith(x.id + ".")), t = m.tasks.find(x => m.id + "." + x.key === k);
    if (sel.length && !(t.pivot && sel.includes(3))) addXP(5, "f." + k);
    if (t.pivot && sel.includes(3)) toast("Опасный вариант — выбери другой");
    el.closest(".cards").outerHTML = pickHTML(k, t);
    refreshDone(m);
    return;
  }
  if (el.dataset.risk) {
    const i = +el.dataset.risk; S.a["risk." + i] = true; save(); addXP(5, "f.risk." + i);
    el.closest(".task").innerHTML = taskHTML(M[6], M[6].tasks[0]);
    return;
  }
  if (el.dataset.beach != null && el.type === "radio") {
    S.a.beach = +el.dataset.beach; save(); addXP(5, "f.beach"); updateOutputs(); return;
  }
  if (el.dataset.delsale != null) {
    S.sales.splice(+el.dataset.delsale, 1); save();
    el.closest(".task").innerHTML = taskHTML(M[7], M[7].tasks[0]); updateOutputs(); return;
  }
  const act = el.dataset.act;
  if (act === "finish") {
    const m = M.find(x => x.id === el.dataset.m);
    S.done[m.id] = 1; save(); addXP(50, "done." + m.id);
    toast("Значок «" + m.badge + "» получен! +50 XP");
    refreshDone(m);
  } else if (act === "addsale") {
    const c = document.getElementById("sale-c").value.trim(), p = document.getElementById("sale-p").value.trim();
    const r = parseFloat(document.getElementById("sale-r").value.replace(",", "."));
    const msg = document.getElementById("salemsg");
    if (!c || !isFinite(r) || r <= 0) { msg.textContent = "Укажи имя клиента и цену больше нуля."; return; }
    S.sales.push({ d: new Date().toLocaleDateString("ru-RU"), c, p, r }); save();
    addXP(5, "sale." + S.sales.length);
    el.closest(".task").innerHTML = taskHTML(M[7], M[7].tasks[0]); updateOutputs();
  } else if (act === "copy") {
    const txt = reportText(), msg = document.getElementById("copymsg");
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("reporttext")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "Текст выделен — скопируй его вручную."; };
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = "Скопировано! Отправь в мессенджер."; }, fallback); } catch (err) { fallback(); }
  } else if (act === "reset") {
    const note = document.getElementById("resetnote");
    if (el.dataset.armed) { S = fresh(); save(); renderHome(); toast("Игра начата заново"); }
    else { el.dataset.armed = "1"; el.textContent = "Точно стереть всё?"; note.textContent = "Нажми ещё раз для подтверждения."; }
  }
});

app.addEventListener("keydown", e => {
  const n = e.target.closest && e.target.closest(".node[data-go]");
  if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); n.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});

function onField(e) {
  const el = e.target; const k = el.dataset && el.dataset.k; if (!k) return;
  const v = el.type === "checkbox" ? el.checked : el.value;
  S.a[k] = v; save();
  if (v !== "" && v !== false) addXP(5, "f." + k);
  updateOutputs();
}
app.addEventListener("input", onField);
app.addEventListener("change", e => { if (e.target.type === "checkbox" || e.target.tagName === "SELECT") onField(e); });

function refreshDone(m) {
  const bar = document.getElementById("donebar"); if (bar) bar.innerHTML = doneBar(m, M.indexOf(m));
}

route();
})();
</script>
