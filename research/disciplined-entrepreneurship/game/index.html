<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Игра из 8 миссий по методике MIT Disciplined Entrepreneurship для подростков.">
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Стартап-квест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: phone-first single column. Home = board-game road (poster colors) with landmarks and a player token;
   mission = illustrated colored header + stacked quest cards. Game feel: confetti, XP pops, level-up and badge reveals. */
:root {
  --bg: #eef2f8;
  --surface: #ffffff;
  --surface-2: #f5f7fc;
  --ink: #172233;
  --ink-soft: #4a586c;
  --line: #d7dfeb;
  --dot: #d3dbe8;
  --c1: #2b95d6; --c2: #e23d4f; --c3: #f0ad1e; --c4: #5fa62d; --c5: #ef7420; --c6: #8a5bbd;
  --good: #1f9d55; --warn: #d48806; --bad: #d4364a;
  --locked: #b8c2d1;
  --road-edge: #172233;
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1320; --surface: #172131; --surface-2: #1d2a3d; --ink: #e9eef6; --ink-soft: #a9b6c8; --line: #2b3a50; --dot: #1f2b3e;
    --c1: #45a8e6; --c2: #f05768; --c3: #f2b93a; --c4: #79c046; --c5: #f58a3c; --c6: #a27ad6;
    --good: #3cc47a; --warn: #f0a92a; --bad: #f2647a; --locked: #3c4a60; --road-edge: #05080f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1320; --surface: #172131; --surface-2: #1d2a3d; --ink: #e9eef6; --ink-soft: #a9b6c8; --line: #2b3a50; --dot: #1f2b3e;
  --c1: #45a8e6; --c2: #f05768; --c3: #f2b93a; --c4: #79c046; --c5: #f58a3c; --c6: #a27ad6;
  --good: #3cc47a; --warn: #f0a92a; --bad: #f2647a; --locked: #3c4a60; --road-edge: #05080f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  background-image: radial-gradient(var(--dot) 1.4px, transparent 1.6px); background-size: 22px 22px;
}
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 72px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(30px, 8vw, 46px); font-weight: 800; }
h3 { font-size: 15px; font-weight: 600; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--c1); outline-offset: 2px; }
.muted { color: var(--ink-soft); }
.label { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.15em; flex: none; }

/* ---------- home */
.hero { display: flex; flex-direction: column; gap: 10px; padding-block: 6px 16px; }
.hero h1 .w1 { color: var(--c2); }
.hero h1 .w2 { display: inline-block; background: var(--c3); color: #1b2333; padding: 0 .25em; border-radius: .2em; transform: rotate(-2deg); }
.rainbow { display: flex; height: 8px; border-radius: 99px; overflow: hidden; }
.rainbow i { flex: 1; }
.xpcard { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r); padding: 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 12px; align-items: center; box-shadow: 4px 4px 0 var(--ink); }
.lvl-badge { width: 50px; height: 50px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; grid-row: span 2; color: #fff; background: var(--c6); clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); }
.xpbar { height: 12px; border-radius: 99px; background: var(--surface-2); border: 2px solid var(--ink); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--c3) 0 8px, var(--c5) 8px 16px); transition: width .6s cubic-bezier(.2,.9,.3,1.2); }
.xpnum { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; grid-row: span 2; text-align: right; }
.map { margin-block: 14px 4px; }
.map svg { width: 100%; height: auto; display: block; overflow: visible; }
.map .node { cursor: pointer; }
.map .node.locked { cursor: not-allowed; }
.map .node:focus-visible .ring { stroke: var(--ink); }
.roadflow { animation: flow 1.6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -28; } }
.token { animation: bob 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: .9; transform: scale(1.1); } }
.pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.rocket-idle { animation: hover 2s ease-in-out infinite; }
@keyframes hover { 0%,100% { translate: 0 0; } 50% { translate: 0 -6px; } }
.flame { animation: flame .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center top; }
@keyframes flame { from { transform: scaleY(.8); } to { transform: scaleY(1.15); } }
.stickers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sticker { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12px; font-weight: 800; min-width: 0; }
.hex { width: 58px; height: 64px; display: grid; place-items: center; clip-path: polygon(50% 0, 96% 25%, 96% 75%, 50% 100%, 4% 75%, 4% 25%); color: #fff; font-size: 28px; }
.sticker.off .hex { background: var(--locked) !important; opacity: .6; }
.sticker.off { color: var(--ink-soft); }
.panel { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
details.panel summary { cursor: pointer; font-weight: 800; }
details.panel ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.btn { border: 2px solid var(--ink); border-radius: 14px; padding: 12px 18px; font-weight: 800; background: var(--ink); color: var(--bg); box-shadow: 3px 3px 0 var(--c5); transition: transform .12s, box-shadow .12s; }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--c5); }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: 3px 3px 0 var(--line); }
.btn.small { padding: 6px 10px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

/* ---------- mission */
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.topbar .xpcard { flex: 1; min-width: 0; max-width: 340px; padding: 8px 12px; box-shadow: 3px 3px 0 var(--ink); }
.topbar .lvl-badge { width: 40px; height: 40px; font-size: 16px; }
.topbar .xpcard .label { display: none; }
.topbar .xpcard b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .xpnum { font-size: 13px; white-space: nowrap; }
.mhead { border-radius: 22px; color: #fff; background: var(--mc); border: 2px solid var(--road-edge); box-shadow: 5px 5px 0 var(--road-edge); overflow: hidden; }
.mhead.dark-text { color: #1b2333; }
.mhead .scene { display: block; width: 100%; height: auto; background: rgba(255,255,255,.12); }
.mhead .mtitle { display: flex; gap: 14px; align-items: center; padding: 14px 18px 18px; }
.mnum { font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: 1; }
.mhead .label { opacity: .9; }
.mhead h1 { font-size: clamp(21px, 5.4vw, 29px); }
.mprog { display: flex; align-items: center; gap: 10px; padding: 0 18px 16px; font-weight: 800; font-size: 13px; }
.mprog .bar { flex: 1; height: 10px; border-radius: 99px; background: rgba(0,0,0,.18); overflow: hidden; }
.mprog .bar i { display: block; height: 100%; background: currentColor; border-radius: 99px; transition: width .5s; }
.section { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; }
.section > .label { color: var(--mc); display: flex; gap: 8px; align-items: center; }
.coach { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: start; }
.bubble { background: var(--surface-2); border: 2px solid var(--line); border-radius: 4px 18px 18px 18px; padding: 12px 14px; }
.why ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.why li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.why li b { width: 26px; height: 26px; border-radius: 8px; background: var(--mc); color: #fff; display: grid; place-items: center; font-size: 13px; }
.dict { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.term { border: 2px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface-2); min-width: 0; display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; }
.term .ti { width: 44px; height: 44px; border-radius: 12px; background: var(--mc); color: #fff; display: grid; place-items: center; font-size: 24px; }
.term b { display: block; font-family: var(--font-display); font-size: 14px; font-weight: 600; margin-bottom: 2px; color: var(--mc); }
.q { border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.q p.qt { font-weight: 800; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-weight: 600; transition: transform .1s; }
.opt:hover:not(:disabled) { border-color: var(--mc); transform: translateX(3px); }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.explain { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.task { border-top: 2px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.section > .label + .task { border-top: 0; padding-top: 0; }
.task h3 { font-family: var(--font-body); font-size: 16px; font-weight: 800; display: flex; gap: 8px; align-items: center; }
.task h3 .done-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 12px; color: #fff; flex: none; }
.task h3 .done-dot.on { background: var(--good); border-color: var(--good); }
.hint { font-size: 14px; color: var(--ink-soft); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ink-soft); min-width: 0; }
input[type=text], input[type=number], textarea, select {
  width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface-2);
  border: 2px solid var(--line); border-radius: 10px; padding: 9px 11px;
}
textarea { min-height: 70px; resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--mc); outline: none; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.checks label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-weight: 600; }
.checks input { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--mc); flex: none; }
.out { border-radius: 14px; padding: 14px; background: color-mix(in srgb, var(--mc) 10%, var(--surface)); border: 2px solid color-mix(in srgb, var(--mc) 45%, var(--line)); display: flex; flex-direction: column; gap: 8px; }
.big { font-family: var(--font-display); font-weight: 800; font-size: 26px; font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px; min-width: 0; }
.kpi small { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.kpi span { font-family: var(--font-display); font-weight: 800; font-size: 19px; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: 13px; font-weight: 800; color: #fff; }
.pill.good { background: var(--good); } .pill.warn { background: var(--warn); } .pill.bad { background: var(--bad); }
.meter svg { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: 12px; color: var(--ink-soft); font-weight: 800; }
td select { padding: 6px 4px; font-size: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.card { text-align: left; border: 2px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface); display: grid; grid-template-columns: 40px 1fr; gap: 4px 10px; min-width: 0; transition: transform .12s; }
.card:hover { transform: translateY(-2px); }
.card .ci { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); color: var(--mc); display: grid; place-items: center; font-size: 22px; grid-row: span 2; }
.card b { font-weight: 800; }
.card .verdict { grid-column: 1 / -1; }
.card.on { border-color: var(--mc); background: color-mix(in srgb, var(--mc) 12%, var(--surface)); box-shadow: 3px 3px 0 var(--mc); }
.card.on .ci { background: var(--mc); color: #fff; }
.card.on.badpick { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); box-shadow: 3px 3px 0 var(--bad); }
.card.on.badpick .ci { background: var(--bad); }
.verdict { font-size: 14px; font-weight: 700; }
.verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
.flip { perspective: 800px; border: 0; background: none; padding: 0; text-align: left; min-height: 170px; }
.flip .in { position: relative; width: 100%; height: 100%; min-height: 170px; transition: transform .55s; transform-style: preserve-3d; }
.flip.open .in { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; border-radius: 14px; padding: 14px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; gap: 6px; border: 2px solid var(--line); overflow: auto; }
.flip .front { background: var(--surface-2); border-style: dashed; }
.flip .front .q-mark { font-family: var(--font-display); font-size: 26px; color: var(--mc); }
.flip .back { transform: rotateY(180deg); background: var(--surface); }
.flip .tag { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.boss { display: flex; flex-direction: column; gap: 6px; padding: 0 18px 16px; font-weight: 800; }
.hp { height: 16px; border-radius: 99px; background: rgba(0,0,0,.3); border: 2px solid var(--road-edge); overflow: hidden; }
.hp i { display: block; height: 100%; background: linear-gradient(90deg, #ff4d5e, #ffb02e); transition: width .7s cubic-bezier(.3,1.4,.5,1); }
.boss-body { transition: opacity .8s; }
.next { border-left: 6px solid var(--mc); padding: 4px 0 4px 14px; font-weight: 700; }
.done-bar { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.slider-row { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.slider-row .sl { display: grid; grid-template-columns: 92px 1fr 28px; gap: 8px; align-items: center; font-size: 13px; }
input[type=range] { width: 100%; accent-color: var(--mc); }
.plot svg { width: 100%; max-width: 420px; height: auto; display: block; margin: 0 auto; }

/* swipe mini-game */
.deck { position: relative; height: 230px; max-width: 380px; width: 100%; margin: 0 auto; }
.deal { position: absolute; inset: 0; border-radius: 20px; border: 2px solid var(--road-edge); background: var(--surface); box-shadow: 5px 5px 0 var(--mc); padding: 18px; display: flex; flex-direction: column; gap: 10px; justify-content: center; user-select: none; touch-action: pan-y; cursor: grab; }
.deal.back { transform: rotate(-3deg) translate(-4px, 6px); box-shadow: none; opacity: .6; }
.deal .d-step { font-size: 12px; font-weight: 800; color: var(--ink-soft); }
.deal .d-text { font-weight: 800; font-size: 17px; }
.deal .d-nums { display: flex; gap: 8px; flex-wrap: wrap; }
.deal .d-nums span { background: var(--surface-2); border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px; font-size: 13px; font-weight: 800; }
.stamp { position: absolute; top: 14px; padding: 4px 10px; border: 3px solid; border-radius: 8px; font-family: var(--font-display); font-weight: 800; font-size: 15px; opacity: 0; transform: rotate(-12deg); }
.stamp.yes { right: 14px; color: var(--good); } .stamp.no { left: 14px; color: var(--bad); transform: rotate(12deg); }
.swipe-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 380px; width: 100%; margin: 0 auto; }
.swipe-btns .no { box-shadow: 3px 3px 0 var(--bad); }
.swipe-btns .yes { box-shadow: 3px 3px 0 var(--good); }

/* overlays */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(140%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 800; transition: transform .35s, opacity .35s, visibility .35s; z-index: 30; opacity: 0; visibility: hidden; max-width: calc(100% - 32px); text-align: center; }
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; visibility: visible; }
.xpfloat { position: fixed; z-index: 40; pointer-events: none; font-family: var(--font-display); font-weight: 800; font-size: 20px; color: var(--c5); -webkit-text-stroke: 1px var(--road-edge); animation: xpup 1s ease-out forwards; }
@keyframes xpup { from { transform: translate(-50%, 0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translate(-50%, -14px) scale(1.15); } to { transform: translate(-50%, -70px) scale(1); opacity: 0; } }
#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.overlay { position: fixed; inset: 0; z-index: 45; background: rgba(8, 12, 22, .6); display: grid; place-items: center; padding: 16px; }
.overlay .modal { background: var(--surface); border: 3px solid var(--road-edge); border-radius: 24px; box-shadow: 6px 6px 0 var(--c5); padding: 24px 20px; max-width: 360px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; animation: popin .45s cubic-bezier(.2,1.4,.4,1); }
@keyframes popin { from { transform: scale(.6) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
.overlay .hex.bigx { width: 110px; height: 122px; font-size: 56px; position: relative; overflow: hidden; animation: spinin .8s cubic-bezier(.2,1.3,.4,1); }
.overlay .hex.bigx::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.75) 50%, transparent 60%); animation: shine 1.6s .5s ease-in-out infinite; }
@keyframes spinin { from { transform: rotateY(180deg) scale(.4); } to { transform: none; } }
@keyframes shine { from { transform: translateX(-60%); } to { transform: translateX(60%); } }
.sound { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; padding: 0; flex: none; }
.report { white-space: pre-wrap; font-size: 14px; background: var(--surface-2); border-radius: 12px; padding: 14px; border: 2px solid var(--line); max-height: 440px; overflow: auto; }
/* streak, daily, events, legends */
.toprow { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: stretch; }
.streak { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--r); box-shadow: 4px 4px 0 var(--c5); padding: 8px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 86px; }
.streak.cold { box-shadow: 4px 4px 0 var(--line); }
.streak .fire { display: inline-flex; }
.streak:not(.cold) .fire svg { animation: flicker 1s ease-in-out infinite alternate; transform-origin: center bottom; }
@keyframes flicker { from { transform: scale(1) rotate(-4deg); } to { transform: scale(1.1) rotate(4deg); } }
.streak b { font-family: var(--font-display); font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.streak small { font-size: 11px; font-weight: 800; color: var(--ink-soft); white-space: nowrap; }

/* ================================================================== состояние */
/* Ключ хранилища не меняется между версиями игры — обновления подхватывают старый прогресс.
   migrate() дополняет старые сохранения новыми полями и ничего не удаляет. */
const KEY = "startup-quest-v1";
const STATE_VERSION = 2;
function fresh() {
  return { v: STATE_VERSION, xp: 0, a: {}, got: {}, quiz: {}, done: {}, sales: [], swipe: {},
    streak: { count: 0, best: 0, last: null }, daily: { date: null, quests: [], done: {} },
    events: { answered: {}, cur: null }, legends: { read: {} } };
}
function migrate(raw) {
  const f = fresh(), s = Object.assign(fresh(), raw || {});
  ["a", "got", "quiz", "done", "swipe"].forEach(k => { if (!s[k] || typeof s[k] !== "object" || Array.isArray(s[k])) s[k] = f[k]; });
  if (!Array.isArray(s.sales)) s.sales = [];
  s.xp = +s.xp || 0;
  s.streak = Object.assign(f.streak, raw && raw.streak);
  s.daily = Object.assign(f.daily, raw && raw.daily);
  s.events = Object.assign(f.events, raw && raw.events); s.events.answered = s.events.answered || {};
  s.legends = Object.assign(f.legends, raw && raw.legends); s.legends.read = s.legends.read || {};
  s.v = Math.max(STATE_VERSION, +(raw && raw.v) || 0);
  return s;
}
let S = fresh();
try {
  const raw = JSON.parse(localStorage.getItem(KEY));
  if (raw && typeof raw === "object") {
    if ((+raw.v || 0) < STATE_VERSION) localStorage.setItem(KEY + "-backup-v" + (raw.v || 0), JSON.stringify(raw));
    S = migrate(raw);
  }
} catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- даты, серия, задания дня */
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => dstr(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return dstr(d); };
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { return () => (seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296; }
function streakNow() {
  const st = S.streak;
  if (st.last === today()) return { n: st.count, hot: true };
  if (st.last === yesterday()) return { n: st.count, hot: false, warn: true };
  return { n: 0, hot: false };
}
function ensureDaily() {
  const d = today(); if (S.daily.date === d && S.daily.quests.length) return;
  const cur = M.find(m => !S.done[m.id]) || M[7];
  const r = rng(hashStr(d)), pool = DAILY[cur.id].slice(), all = DAILY.all;
  const pick = [];
  while (pick.length < 2 && pool.length) pick.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  pick.push(all[Math.floor(r() * all.length)]);
  S.daily = { date: d, quests: pick, done: {} }; save();
}
function touchStreak() {
  const st = S.streak, t = today(); if (st.last === t) return;
  st.count = st.last === yesterday() ? st.count + 1 : 1;
  st.last = t; st.best = Math.max(st.best, st.count); save();
  const bonus = STREAK_BONUS[st.count];
  if (bonus && addXP(bonus, "streak." + st.count)) { confetti(innerWidth / 2, innerHeight / 3, 120); toast("Серия " + st.count + " дн. подряд! +" + bonus + " XP"); }
  else toast("Серия: " + st.count + " дн. подряд!");
}

/* ---------- резервный код: перенос прогресса между ссылками, файлами и устройствами */
function exportCode() { return "SQ" + STATE_VERSION + ":" + btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function importCode(code) {
  code = code.trim().replace(/\s+/g, "");
  if (/^SQ\d+:/.test(code)) code = code.slice(code.indexOf(":") + 1);
  return migrate(JSON.parse(decodeURIComponent(escape(atob(code)))));
}
function mergeState(a, b) {
  const m = migrate(JSON.parse(JSON.stringify(a)));
  m.xp = Math.max(a.xp, b.xp);
  m.got = Object.assign({}, b.got, a.got); m.done = Object.assign({}, b.done, a.done);
  m.swipe = Object.assign({}, b.swipe, a.swipe);
  Object.entries(b.quiz).forEach(([k, v]) => { const c = m.quiz[k]; if (!c || (!c.solved && v.solved)) m.quiz[k] = v; });
  const empty = v => v == null || v === "" || v === false || (Array.isArray(v) && !v.length);
  Object.entries(b.a).forEach(([k, v]) => { if (empty(m.a[k]) && !empty(v)) m.a[k] = v; });
  const key = s => [s.d, s.c, s.p, s.r].join("|"), seen = new Set(m.sales.map(key));

}

const cv = document.getElementById("confetti"), cx = cv.getContext("2d");
let parts = [], raf = 0;
const PCOL = ["#2b95d6", "#e23d4f", "#f0ad1e", "#5fa62d", "#ef7420", "#8a5bbd"];
function confetti(x, y, n) {
  if (reduced()) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  for (let i = 0; i < (n || 80); i++) {
    const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 8;
    parts.push({ x: x * dpr, y: y * dpr, vx: Math.cos(a) * sp * dpr, vy: (Math.sin(a) * sp - 6) * dpr, g: .35 * dpr,
      r: (4 + Math.random() * 5) * dpr, c: PCOL[i % 6], rot: Math.random() * 6, vr: (Math.random() - .5) * .4, life: 90 + Math.random() * 40, shape: i % 3 });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c; cx.globalAlpha = Math.max(0, Math.min(1, p.life / 30));
    if (p.shape === 0) cx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
    else if (p.shape === 1) { cx.beginPath(); cx.arc(0, 0, p.r * .7, 0, 7); cx.fill(); }
    else { cx.beginPath(); cx.moveTo(0, -p.r); cx.lineTo(p.r, p.r); cx.lineTo(-p.r, p.r); cx.fill(); }
    cx.restore();
  });
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 50);
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
}

function refreshProgress(m) {
  const p = missionProgress(m), b = document.getElementById("mbar"), t = document.getElementById("mpct");
  if (b) b.style.width = p + "%"; if (t) t.textContent = p + "%";
  document.querySelectorAll(".task[data-ti]").forEach(el => {
    const d = el.querySelector(".done-dot"); if (d) { const on = taskFilled(m, m.tasks[+el.dataset.ti]); d.classList.toggle("on", on); d.textContent = on ? "✓" : ""; }
  });
}
let bossWasDead = false;
function updateBoss(fx) {
  const el = document.getElementById("boss"); if (!el) return;
  const hp = bossHP();
  el.innerHTML = `<div class="row" style="justify-content:space-between"><span>${hp > 0 ? "Здоровье босса" : "Босс повержен!"}</span><span>${hp}%</span></div><div class="hp"><i style="width:${hp}%"></i></div>`;
  const body = document.querySelector(".mhead .scene .boss-body"); if (body) body.style.opacity = hp === 0 ? ".2" : "1";
  if (fx && hp === 0 && !bossWasDead) {
    sfx.win(); confetti(innerWidth / 2, innerHeight / 3, 160);
    addXP(20, "boss"); toast("Мистер Допущение повержен!");
  }
  bossWasDead = hp === 0;
}

function quizHTML(qid, q) {
  const st = S.quiz[qid] || { picked: [], solved: false };
  return `<div class="q" data-q="${qid}"><p class="qt">${esc(q.q)}</p><div class="opts">
    ${q.o.map((o, i) => {
      const cls = st.picked.includes(i) ? (i === q.c ? "right" : "wrong") : "";
      return `<button class="opt ${cls}" data-qopt="${qid}|${i}" ${st.solved ? "disabled" : ""}>${esc(o)}</button>`;
    }).join("")}</div>
    ${st.picked.length ? `<p class="explain">${st.solved ? "<b>Верно!</b> " : "<b>Не совсем.</b> Попробуй ещё. "}${esc(q.e)}</p>` : ""}</div>`;

function inp(key, ph, multi) {
  return multi
    ? `<textarea id="f-${key}" data-k="${key}" placeholder="${esc(ph)}">${esc(val(key))}</textarea>`
    : `<input type="text" id="f-${key}" data-k="${key}" placeholder="${esc(ph)}" value="${esc(val(key))}">`;
}
function numInp(key, label, def) {
  return `<label class="f">${esc(label)}<input type="number" inputmode="decimal" id="f-${key}" data-k="${key}" data-num="1" value="${esc(S.a[key] ?? def)}"></label>`;
}

function taskHTML(m, t) {
  const p = m.id + ".", on = taskFilled(m, t);
  const head = `<h3><span class="done-dot ${on ? "on" : ""}">${on ? "✓" : ""}</span>${t.icon ? `<span style="color:var(--mc);display:inline-flex">${ico(t.icon)}</span>` : ""}<span>${esc(t.title)}</span></h3>${t.hint ? `<p class="hint">${esc(t.hint)}</p>` : ""}`;
  switch (t.type) {
    case "text": return head + inp(p + t.key, t.ph, true);
    case "list": return head + `<div class="grid2">${Array.from({ length: t.n }, (_, i) => `<label class="f">${i + 1}${inp(p + t.key + "." + i, t.ph[i])}</label>`).join("")}</div>`;
    case "fields": return head + `<div class="grid2">${t.fields.map((f, i) => `<label class="f">${esc(f[0])}${inp(p + t.key + "." + i, f[1])}</label>`).join("")}</div>`;
    case "grid": return head + Array.from({ length: t.rows }, (_, r) => `<div class="grid2">${t.cols.map((c, ci) => `<label class="f">${r + 1}. ${esc(c[0])}${inp(p + t.key + "." + r + "." + ci, r === 0 ? c[1] : "")}</label>`).join("")}</div>`).join("");
    case "checks": return head + `<div class="checks">${t.items.map((it, i) => { const k = p + t.key + "." + i;
      return `<label><input type="checkbox" id="f-${k}" data-k="${k}" ${S.a[k] ? "checked" : ""}>${esc(it)}</label>`; }).join("")}</div>`;
    case "pick": return head + pickHTML(p + t.key, t);
    case "segscore": return head + segHTML();
    case "tam": return head + `<p class="hint">Цифры для примера — замени своими.</p><div class="grid2">
      ${numInp("tam.people", "Сколько людей на плацдарме", 60)}${numInp("tam.freq", "Сколько флаконов в год покупает один", 2)}${numInp("tam.check", "Средняя цена одного флакона, ₽", 400)}</div>
      <div class="out" data-out="tam"></div>`;
    case "ten": return head + `<div class="tablewrap"><table><thead><tr><th>#</th><th>Имя / класс</th><th>Реакция</th></tr></thead><tbody>
      ${Array.from({ length: 10 }, (_, i) => `<tr><td>${i + 1}</td><td>${inp("ten." + i + ".n", i === 0 ? "Аня, 8А" : "")}</td><td><select id="f-ten.${i}.r" data-k="ten.${i}.r" aria-label="Реакция ${i + 1}">
        ${["", "Куплю!", "Может быть", "Не интересно"].map(o => `<option ${val("ten." + i + ".r") === o ? "selected" : ""}>${o}</option>`).join("")}</select></td></tr>`).join("")}
      </tbody></table></div><div class="out" data-out="ten"></div>`;
    case "value": return head + `<p class="hint">Цифры для примера — замени своими.</p><div class="grid2">
      <label class="f">Аромат, на который похож твой${inp("val.brand", "известный дорогой аромат")}</label>
      ${numInp("val.op", "Цена оригинала, ₽", 12000)}${numInp("val.oml", "Объём оригинала, мл", 100)}${numInp("val.mp", "Твоя цена, ₽", 450)}${numInp("val.mml", "Твой объём, мл", 5)}</div>
      <div class="out" data-out="value"></div>`;
    case "compete": return head + competeHTML();
    case "unit": return head + `<p class="hint">Цифры для примера — замени своими.</p><div class="grid2">
      ${numInp("u.bp", "Цена большого флакона у поставщика, ₽", 6000)}${numInp("u.bml", "Объём большого флакона, мл", 100)}
      ${numInp("u.pack", "Пустой мини-флакон + наклейка, ₽", 35)}${numInp("u.mml", "Объём твоего мини-флакона, мл", 5)}
      ${numInp("u.price", "Твоя цена, ₽", 450)}${numInp("u.rep", "Сколько раз клиент купит за год", 3)}
      ${numInp("u.acq", "Траты на привлечение в месяц (пробники, скидки), ₽", 400)}${numInp("u.newc", "Новых клиентов в месяц", 4)}</div>
      <div class="out" data-out="unit"></div>`;
    case "risks": return head + `<div class="cards">${RISKS.map((r, i) => { const open = !!S.a["risk." + i];
      return `<button class="flip ${open ? "open" : ""}" data-risk="${i}" aria-expanded="${open}" aria-label="${esc(r[0])}${open ? ": " + esc(r[3]) : ""}"><div class="in">
        <div class="face front"><span class="q-mark">?</span><b>${esc(r[0])}</b><span class="muted">Нажми, чтобы проверить</span></div>
        <div class="face back"><span class="tag" style="color:var(--${r[1]})">${esc(r[2])}</span><b>${esc(r[0])}</b><span style="font-size:14px">${esc(r[3])}</span></div></div></button>`; }).join("")}</div>`;
    case "sales": return head + salesHTML();
    case "swipe": return head + swipeHTML();
  }
  return "";
}

function salesStats() {
  const by = {};
  S.sales.forEach(s => { const k = s.c.trim().toLowerCase(); by[k] = (by[k] || 0) + 1; });
  const clients = Object.keys(by).length, repeat = Object.values(by).filter(n => n > 1).length;
  const rev = S.sales.reduce((a, s) => a + s.r, 0), cost = unitCost() * S.sales.length;

}

function answerSwipe(yes) {

function bindDeck() {
  const card = document.getElementById("deal"); if (!card) return;
  let sx = null, dx = 0;
  const yesS = card.querySelector(".stamp.yes"), noS = card.querySelector(".stamp.no");
  card.addEventListener("pointerdown", e => { sx = e.clientX; dx = 0; try { card.setPointerCapture(e.pointerId); } catch (err) {} card.style.transition = "none"; });
  card.addEventListener("pointermove", e => {
    if (sx == null) return; dx = e.clientX - sx;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 14}deg)`;
    yesS.style.opacity = Math.max(0, Math.min(1, dx / 90)); noS.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (sx == null) return; sx = null;
    if (Math.abs(dx) > 90) answerSwipe(dx > 0);
    else { card.style.transition = "transform .25s"; card.style.transform = ""; yesS.style.opacity = 0; noS.style.opacity = 0; }
  };
  card.addEventListener("pointerup", end); card.addEventListener("pointercancel", end);
}

      <div class="mtitle"><div class="mnum">${doneCount}/8</div><div><div class="label">Финал</div><h1>Демо-день</h1></div></div></header>
    <div class="panel"><p>Покажи этот отчёт своему инвестору — родителям. Расскажи, что ты узнал и что поменял по ходу. Отчёт собирается из твоих ответов во всех миссиях.</p>
      <div class="kpis"><div class="kpi"><small>Уровень</small><span>${esc(L.name)}</span></div><div class="kpi"><small>Опыт</small><span>${fmt(S.xp)} XP</span></div><div class="kpi"><small>Значки</small><span>${doneCount} из 8</span></div></div></div>
    <div class="row"><button class="btn" data-act="copy">Скопировать отчёт</button><span class="muted" id="copymsg"></span></div>
    <pre class="report" id="reporttext">${esc(reportText())}</pre></div>`;
  window.scrollTo(0, 0);
  if (doneCount === 8 && !S.got.finale) { S.got.finale = 1; save(); setTimeout(() => { sfx.win(); confetti(innerWidth / 2, innerHeight / 3, 200); }, 300); }
}

/* ================================================================== события */
function route() {
  const h = location.hash.replace("#", "");
  if (h === "report") return renderReport();
  if (M.some(m => m.id === h)) return renderMission(h);
  renderHome();
}
window.addEventListener("hashchange", route);
function go(target) {
  if (target === "home") { if (location.hash && location.hash !== "#") location.hash = ""; else route(); }
  else if (location.hash === "#" + target) route();
  else location.hash = target;
}
function shakeHead() { const b = document.querySelector(".mhead"); if (b) { b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); } }

app.addEventListener("click", e => {
  const el = e.target.closest("[data-go],[data-qopt],[data-pick],[data-risk],[data-act],[data-delsale],[data-beach],[data-swipe],[data-daily],[data-event],[data-legend],[data-hall]");
  if (!el) return;
  if (el.dataset.daily != null) {
    const i = +el.dataset.daily; if (S.daily.done[i]) return;
    S.daily.done[i] = true; save(); sfx.good();
    const r = el.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top, 40);
    addXP(15, "daily." + S.daily.date + "." + i); touchStreak();
    if (S.daily.quests.every((q, k) => S.daily.done[k]) && addXP(25, "chest." + S.daily.date)) { sfx.win(); confetti(innerWidth / 2, innerHeight / 3, 140); toast("Сундук дня открыт! +25 XP"); }
    document.getElementById("dailybox").innerHTML = dailyHTML();
    const sb = document.getElementById("streakbox"); if (sb) sb.outerHTML = streakBox();
    return;
  }
  if (el.dataset.event) {
    const [id, oi] = el.dataset.event.split("|"), ev = EVENTS.find(x => x.id === id), g = ev.o[+oi][1];
    if (S.events.answered[id] != null) return;
    S.events.answered[id] = +oi; save();
    if (g === 2) { sfx.good(); const r = el.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top, 50); addXP(15, "event." + id); }
    else if (g === 1) { sfx.coin(); addXP(5, "event." + id); }
    else sfx.bad();
    document.getElementById("eventbox").innerHTML = eventHTML(false);
    return;
  }
  if (el.dataset.legend) {
    const l = LEGENDS.find(x => x.id === el.dataset.legend); readLegend(l.id); sfx.good();
    el.closest(".legend").outerHTML = legendHTML(l, true);
    return;
  }
  if (el.dataset.hall) {
    const l = LEGENDS.find(x => x.id === el.dataset.hall), mi = M.findIndex(m => m.id === l.m);
    if (!unlocked(mi)) { sfx.bad(); toast("Откроется в миссии " + (mi + 1)); return; }
    showModal(legendHTML(l, true), "Вдохновляет!", () => renderHome());
    readLegend(l.id);
    return;
  }
  if (el.dataset.go) {
    const i = M.findIndex(m => m.id === el.dataset.go);
    if (i >= 0 && !unlocked(i)) { sfx.bad(); toast("Сначала пройди миссию " + i); return; }
    return go(el.dataset.go);
  }
  if (el.dataset.swipe != null) { answerSwipe(el.dataset.swipe === "1"); return; }
  if (el.dataset.qopt) {
    const [qid, oi] = el.dataset.qopt.split("|"), i = +oi;
    const [mid, qk] = qid.split(".q"), m = M.find(x => x.id === mid), q = m.quiz[+qk];
    const st = S.quiz[qid] || { picked: [], solved: false };
    if (st.solved || st.picked.includes(i)) return;
    const first = st.picked.length === 0;
    st.picked.push(i); if (i === q.c) st.solved = true;
    S.quiz[qid] = st; save();
    const r = el.getBoundingClientRect();
    if (st.solved) { sfx.good(); confetti(r.left + r.width / 2, r.top + r.height / 2, 40); if (first) addXP(10, "quiz." + qid); }
    else sfx.bad();
    el.closest(".q").outerHTML = quizHTML(qid, q);
    if (!st.solved) { const nb = document.querySelector(`[data-qopt="${qid}|${i}"]`); if (nb) nb.classList.add("shake"); }
    refreshDone(m); refreshProgress(m);
    return;
  }
  if (el.dataset.pick) {
    const [k, oi, max] = el.dataset.pick.split("|"), i = +oi;
    let sel = (S.a[k] || []).slice();
    if (sel.includes(i)) sel = sel.filter(x => x !== i);
    else { sel.push(i); if (sel.length > +max) sel.shift(); }
    S.a[k] = sel; save();
    const m = M.find(x => k.startsWith(x.id + ".")), t = m.tasks.find(x => m.id + "." + x.key === k);
    const bad = t.pivot && sel.includes(3);
    if (sel.length && !bad) addXP(5, "f." + k);
    if (bad) { sfx.bad(); toast("Опасный вариант! Босс лечится — выбери другой"); shakeHead(); }
    else if (t.pivot && sel.length) sfx.hit();
    el.closest(".cards").outerHTML = pickHTML(k, t);
    refreshDone(m); refreshProgress(m); if (t.pivot) updateBoss(true);
    return;
  }
  if (el.dataset.risk) {
    const i = +el.dataset.risk; if (S.a["risk." + i]) return;
    S.a["risk." + i] = true; save(); sfx.hit(); addXP(5, "f.risk." + i);
    el.classList.add("open"); el.setAttribute("aria-expanded", "true");
    shakeHead();
    refreshDone(M[6]); refreshProgress(M[6]); updateBoss(true);
    return;
  }
  if (el.dataset.beach != null && el.type === "radio") {
    S.a.beach = +el.dataset.beach; save(); addXP(5, "f.beach"); updateOutputs(); refreshProgress(M[0]); return;
  }
  if (el.dataset.delsale != null) {
    S.sales.splice(+el.dataset.delsale, 1); save();
    el.closest(".task").innerHTML = taskHTML(M[7], M[7].tasks[0]); updateOutputs(); refreshProgress(M[7]); return;
  }
  const act = el.dataset.act;
  if (act === "finish") {
    const m = M.find(x => x.id === el.dataset.m), idx = M.indexOf(m);
    S.done[m.id] = 1; save(); sfx.win(); confetti(innerWidth / 2, innerHeight / 3, 160);
    addXP(50, "done." + m.id);
    refreshDone(m);
    showModal(`<div class="hex bigx" style="background:var(${m.color})">${ico(m.icon, 2.2)}</div>
      <div class="label muted">Новый значок</div><h2 style="font-size:24px">${esc(m.badge)}</h2>
      <p class="muted">Миссия ${idx + 1} пройдена! +50 XP. ${idx < 7 ? "Открыта миссия " + (idx + 2) + "." : "Впереди демо-день!"}</p>`,
      idx < 7 ? "Следующая миссия" : "К демо-дню", () => go(idx < 7 ? M[idx + 1].id : "report"), ["На карту", () => go("home")]);
  } else if (act === "addsale") {
    const c = document.getElementById("sale-c").value.trim(), p = document.getElementById("sale-p").value.trim();
    const r = parseFloat(document.getElementById("sale-r").value.replace(",", "."));
    const msg = document.getElementById("salemsg");
    if (!c || !isFinite(r) || r <= 0) { sfx.bad(); msg.textContent = "Укажи имя клиента и цену больше нуля."; return; }
    const repeatBuy = S.sales.some(s => s.c.trim().toLowerCase() === c.toLowerCase());
    S.sales.push({ d: new Date().toLocaleDateString("ru-RU"), c, p, r }); save();
    addXP(5, "sale." + S.sales.length);
    if (repeatBuy) { const rr = el.getBoundingClientRect(); confetti(rr.left + rr.width / 2, rr.top, 60); toast("Повторная покупка! Собаки едят корм"); }
    el.closest(".task").innerHTML = taskHTML(M[7], M[7].tasks[0]); updateOutputs(); refreshProgress(M[7]);
  } else if (act === "drawevent") {
    S.events.cur = pickEvent(true); save(); sfx.hit();
    document.getElementById("eventbox").innerHTML = eventHTML(true);
  } else if (act === "backupcopy") {
    const code = exportCode(), msg = document.getElementById("backupmsg"), box = document.getElementById("importbox");
    const fallback = () => { box.value = code; box.select(); msg.textContent = "Код в поле ниже — скопируй его вручную."; };
    try { navigator.clipboard.writeText(code).then(() => { msg.textContent = "Код скопирован! Сохрани его в заметках или отправь себе."; sfx.good(); }, fallback); } catch (err) { fallback(); }
  } else if (act === "backuprestore") {
    const msg = document.getElementById("restoremsg"), code = document.getElementById("importbox").value;
    if (!code.trim()) { msg.textContent = "Сначала вставь код сохранения."; return; }
    try {
      const before = S.xp; S = mergeState(S, importCode(code)); save();
      renderHome(); sfx.win(); confetti(innerWidth / 2, innerHeight / 3, 120);
      toast(S.xp > before ? "Прогресс объединён! Теперь у тебя " + fmt(S.xp) + " XP" : "Прогресс объединён!");
    } catch (err) { sfx.bad(); msg.textContent = "Код не подошёл. Проверь, что он скопирован целиком."; }
  } else if (act === "swipereset") {
    S.swipe = {}; save(); el.closest(".task").innerHTML = taskHTML(M[5], M[5].tasks[0]); bindDeck(); refreshProgress(M[5]);
  } else if (act === "copy") {
    const txt = reportText(), msg = document.getElementById("copymsg");
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("reporttext")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg.textContent = "Текст выделен — скопируй его вручную."; };
    try { navigator.clipboard.writeText(txt).then(() => { msg.textContent = "Скопировано! Отправь в мессенджер."; sfx.good(); }, fallback); } catch (err) { fallback(); }
  } else if (act === "sound") {
    soundOn = !soundOn; try { localStorage.setItem("startup-quest-sound", soundOn ? "on" : "off"); } catch (err) {}
    el.outerHTML = soundBtn(); if (soundOn) sfx.good();
  } else if (act === "reset") {
    const note = document.getElementById("resetnote");
    if (el.dataset.armed) { S = fresh(); save(); renderHome(); toast("Игра начата заново"); }
    else { el.dataset.armed = "1"; el.textContent = "Точно стереть всё?"; note.textContent = "Нажми ещё раз для подтверждения."; }
  }
});

app.addEventListener("keydown", e => {
  const n = e.target.closest && e.target.closest(".node[data-go]");
  if (n && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); n.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});

function onField(e) {
  const el = e.target; const k = el.dataset && el.dataset.k; if (!k) return;
  const v = el.type === "checkbox" ? el.checked : el.value;
  S.a[k] = v; save();
  if (v !== "" && v !== false) addXP(5, "f." + k);
  updateOutputs();
  const id = location.hash.replace("#", ""), m = M.find(x => x.id === id); if (m) refreshProgress(m);
}
app.addEventListener("input", onField);
app.addEventListener("change", e => { if (e.target.type === "checkbox" || e.target.tagName === "SELECT") onField(e); });

function refreshDone(m) { const bar = document.getElementById("donebar"); if (bar) bar.innerHTML = doneBar(m, M.indexOf(m)); }

route();
})();
</script>

</body>
